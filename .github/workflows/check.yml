name: Check

# Compiles and tests without publishing anything. A push to main ships to TestFlight, so main is
# a bad place to find out something doesn't compile: every other branch and every PR runs this.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: gi-os/.github/.github/workflows/ios-check.yml@main
