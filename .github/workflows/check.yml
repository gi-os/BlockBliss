name: Check

# Compiles and tests without publishing anything. A push to main ships to TestFlight, so main is
# a bad place to find out something doesn't compile: every other branch runs this.
# Push runs show on a PR too, so there's no pull_request trigger (it would run everything twice).
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: gi-os/.github/.github/workflows/ios-check.yml@main
